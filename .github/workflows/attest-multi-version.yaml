name: Attest multiple tarballs (3 versions, end-to-end)

# End-to-end test of the multi-tarball attestation change. Packs THREE distinct
# versions of this example package into a single directory, publishes all of
# them to JFrog (cybersec-npm-prod-public, the repo the OSS API can read),
# attests the whole directory in one call (one single-subject attestation per
# tarball, via the feature branch), then verifies each version was deployed to
# npmjs.com through the OSS Supply Chain pipeline one by one.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label to run on. Use a medium/large or ubuntu-latest runner: the small runner has flaky egress to rekor.sigstore.dev and times out during signing.'
        required: false
        default: 'public-ledgerhq-shared-medium'

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  JFROG_NPM_REPO: cybersec-npm-prod-public

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4

      - name: Pack three versions into one directory
        id: pack
        run: |
          set -euo pipefail

          # Three distinct, collision-free versions (unique per run).
          BASE=$(date +%s)
          VERSION_A="0.2.${BASE}"
          VERSION_B="0.2.$((BASE + 1))"
          VERSION_C="0.2.$((BASE + 2))"

          PKG_BASENAME="ledger-releaser-examplepackage12"
          mkdir -p dist-tarballs

          for VERSION in "$VERSION_A" "$VERSION_B" "$VERSION_C"; do
            rm -rf build
            mkdir -p build
            cp index.js README.md build/ 2>/dev/null || true
            jq --arg v "$VERSION" '.version = $v' package.json > build/package.json
            (cd build && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-tarballs" >/dev/null)
          done

          echo "Packed tarballs:"
          ls -1 dist-tarballs/*.tgz

          echo "VERSION_A=${VERSION_A}" >> "$GITHUB_OUTPUT"
          echo "VERSION_B=${VERSION_B}" >> "$GITHUB_OUTPUT"
          echo "VERSION_C=${VERSION_C}" >> "$GITHUB_OUTPUT"
          echo "TARBALL_A=dist-tarballs/${PKG_BASENAME}-${VERSION_A}.tgz" >> "$GITHUB_OUTPUT"
          echo "TARBALL_B=dist-tarballs/${PKG_BASENAME}-${VERSION_B}.tgz" >> "$GITHUB_OUTPUT"
          echo "TARBALL_C=dist-tarballs/${PKG_BASENAME}-${VERSION_C}.tgz" >> "$GITHUB_OUTPUT"

      - name: Login to JFrog Ledger
        id: jfrog-login
        uses: LedgerHQ/actions-security/actions/jfrog-login@actions/jfrog-login-1

      - name: Configure npm authentication
        run: |
          REG="https://jfrog.ledgerlabs.net/artifactory/api/npm/${JFROG_NPM_REPO}/"
          echo "registry=${REG}" > .npmrc
          echo "//jfrog.ledgerlabs.net/artifactory/api/npm/${JFROG_NPM_REPO}/:_authToken=${{ steps.jfrog-login.outputs.oidc-token }}" >> .npmrc
          echo "//jfrog.ledgerlabs.net/artifactory/api/npm/${JFROG_NPM_REPO}/:always-auth=true" >> .npmrc

      - name: Publish all versions to JFrog Ledger with npm
        run: |
          set -euo pipefail
          for tarball in "$GITHUB_WORKSPACE"/dist-tarballs/*.tgz; do
            echo "Publishing $tarball"
            npm publish "$tarball" --tag tagtesting
          done

      - name: Attest all tarballs for npmjs.com (feature branch)
        id: attest
        uses: LedgerHQ/actions-security/actions/attest-for-npmsjs-com@xchalle/attest-npmjs-multi-tarball
        with:
          subject-path: dist-tarballs

      - name: Report attested tarballs
        run: |
          echo "Attested every .tgz in dist-tarballs; first tarball-path output:"
          echo "  ${{ steps.attest.outputs.tarball-path }}"
          echo "All tarballs:"
          ls -1 dist-tarballs/*.tgz

      - name: Check OSS publishing status (version A)
        uses: LedgerHQ/actions-security/actions/check-publishing-oss@actions/check-publishing-oss-0
        with:
          package-type: npm
          tarball-path: ${{ steps.pack.outputs.TARBALL_A }}

      - name: Check OSS publishing status (version B)
        uses: LedgerHQ/actions-security/actions/check-publishing-oss@actions/check-publishing-oss-0
        with:
          package-type: npm
          tarball-path: ${{ steps.pack.outputs.TARBALL_B }}

      - name: Check OSS publishing status (version C)
        uses: LedgerHQ/actions-security/actions/check-publishing-oss@actions/check-publishing-oss-0
        with:
          package-type: npm
          tarball-path: ${{ steps.pack.outputs.TARBALL_C }}
